<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الترتيب</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#fff;padding:20px 14px;
 background:radial-gradient(ellipse at 50% 0%,#2a3fd0 0%,#0a1470 40%,#02041a 100%) fixed}
.wrap{max-width:980px;margin:0 auto}
h1{text-align:center;color:#e8b923;font-size:1.9rem;margin-bottom:14px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.stat{border:2px solid #e8b923;border-radius:16px;padding:10px 22px;text-align:center;background:#0a1470aa}
.stat b{display:block;font-size:1.6rem;color:#ffd04d}
.card{border:2px solid #e8b923;border-radius:20px;padding:16px;background:#060c40cc}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 8px;text-align:center;border-bottom:1px solid #ffffff22;font-size:1.1rem}
th{color:#e8b923}
td.nm{text-align:right}
tr:nth-child(1) td:first-child{color:#ffd700;font-weight:bold}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn{padding:10px 22px;border-radius:30px;border:2px solid #e8b923;background:#0a1470;color:#fff;cursor:pointer;font-family:inherit;font-size:1rem}
.btn:hover{background:#e8b923;color:#000}
.btn.red{border-color:#ff6b6b}.btn.red:hover{background:#ff6b6b}
.x{background:none;border:none;color:#ff8a8a;cursor:pointer;font-size:1.1rem}
.sub{text-align:center;color:#aab2ff;margin-bottom:12px;font-size:.95rem}
.v{background:none;border:none;color:#9fd0ff;cursor:pointer;font-size:1.1rem;margin-inline-end:6px}
/* نافذة عرض الإجابات */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px;z-index:10}
#modal.open{display:flex}
.mbox{width:100%;max-width:820px;background:#060c40;border:2px solid #e8b923;border-radius:20px;padding:18px}
.mtools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.stu h2{color:#e8b923;font-size:1.3rem;margin-bottom:6px;text-align:right}
.info{display:flex;gap:8px 18px;flex-wrap:wrap;margin-bottom:10px;color:#ffe9a0}
.info b{color:#fff}
.rv{border:2px solid #ffffff33;border-radius:14px;padding:10px 14px;margin:10px 0;background:#050a3a99;break-inside:avoid}
.rv.ok{border-color:#2ecc71}.rv.bad{border-color:#ff6b6b}.rv.skip{border-color:#e8b923}
.rv-h{display:flex;justify-content:space-between;gap:8px;font-weight:bold;margin-bottom:6px}
.rv.ok .st{color:#2ecc71}.rv.bad .st{color:#ff8a8a}.rv.skip .st{color:#ffd04d}
.rv-q{line-height:1.8;margin-bottom:6px;unicode-bidi:plaintext}
.rv-img{max-width:160px;max-height:110px;display:block;margin:4px 0 8px;background:#fff;border-radius:8px;padding:3px}
.rv-o{display:flex;gap:8px;align-items:flex-start;padding:5px 9px;border-radius:10px;margin:3px 0;border:1px solid #ffffff22;line-height:1.6;font-size:1rem}
.rv-o .mk{flex:none;width:1.6em;text-align:center;font-weight:bold}
.rv-o.c{background:#1c8a4e66;border-color:#2ecc71}
.rv-o.w{background:#c0392b66;border-color:#ff6b6b}
.rv-o .tag{margin-inline-start:auto;font-size:.85rem;white-space:nowrap}
#print-area{display:none}
@media print{
 body.printing{background:#fff!important;color:#000!important;padding:0;min-height:0}
 body.printing > *:not(#print-area){display:none!important}
 body.printing #print-area{display:block}
 .printing .stu{page-break-after:always;font-size:11pt}
 .printing .stu:last-child{page-break-after:auto}
 .printing .stu h2{color:#000;font-size:15pt;border-bottom:2px solid #000;padding-bottom:4px}
 .printing .info{color:#000}.printing .info b{color:#000}
 .printing .rv{background:#fff;border:1px solid #000;border-radius:6px;padding:5px 9px;margin:6px 0;break-inside:avoid}
 .printing .rv-h,.printing .rv-q,.printing .rv-o{color:#000}
 .printing .rv .st{color:#000!important}
 .printing .rv-o{border:1px solid #bbb;padding:2px 7px;margin:2px 0;font-size:10.5pt}
 .printing .rv-o.c{background:#e3f3e8!important;border:2px solid #1c8a4e;font-weight:bold;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .printing .rv-o.w{background:#fbe3e1!important;border:2px solid #c0392b;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .printing .rv-img{max-width:110px;max-height:75px}
 @page{margin:12mm}
}
</style>
</head>
<body>
<div class="wrap">
 <h1>🏆 لوحة الترتيب</h1>
 <div class="sub">تتحدث تلقائيًا كل 3 ثوانٍ</div>
 <div class="stats">
  <div class="stat"><b id="st-n">0</b>عدد التلاميذ</div>
  <div class="stat"><b id="st-avg">–</b>المعدل</div>
  <div class="stat"><b id="st-max">–</b>أعلى نقطة</div>
 </div>
 <div class="card">
  <table>
   <thead><tr><th>الترتيب</th><th>الاسم</th><th>القسم</th><th>الفوج</th><th>النقطة</th><th>المدة</th><th class="adm"></th></tr></thead>
   <tbody id="rows"></tbody>
  </table>
 </div>
 <div class="tools">
  <button class="btn" id="b-printall">🖨 طباعة إجابات كل التلاميذ</button>
  <button class="btn" id="b-csv">⬇ تصدير Excel (CSV)</button>
  <button class="btn red" id="b-reset">🗑 مسح كل النتائج</button>
 </div>
</div>
<div id="modal"><div class="mbox">
 <div class="mtools"><button class="btn" id="m-print">🖨 طباعة إجابات هذا التلميذ</button><button class="btn red" id="m-close">✖ إغلاق</button></div>
 <div id="m-body"></div>
</div></div>
<div id="print-area"></div>
<script>
const $ = s => document.querySelector(s);
let pw = null;
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function askPw(){ if(pw===null){ pw = prompt('كلمة سر الأستاذة:') || null; } return pw; }

async function load(){
  try{
    const rows = await (await fetch('/api/board')).json();
    const tb = $('#rows'); tb.innerHTML = '';
    rows.forEach((r,i)=>{
      const tr = document.createElement('tr');
      const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1);
      [medal, r.name, r.group, r.classGroup || '—', '\u2066'+r.score+' / '+r.total+'\u2069', fmt(r.seconds)].forEach((c,j)=>{
        const td = document.createElement('td'); if(j===1) td.className='nm'; td.textContent = c; tr.appendChild(td);
      });
      const td = document.createElement('td');
      const v = document.createElement('button'); v.className='v'; v.title='عرض الإجابات'; v.textContent='📄'; v.onclick = () => showAnswers(r);
      td.appendChild(v);
      const x = document.createElement('button'); x.className='x'; x.title='حذف'; x.textContent='✖';
      x.onclick = () => del(r);
      td.appendChild(x); tr.appendChild(td);
      tb.appendChild(tr);
    });
    $('#st-n').textContent = rows.length;
    if(rows.length){
      const sum = rows.reduce((a,r)=>a+r.score,0);
      $('#st-avg').textContent = (sum/rows.length).toFixed(1);
      $('#st-max').textContent = rows[0].score + '/' + rows[0].total;
    } else { $('#st-avg').textContent='–'; $('#st-max').textContent='–'; }
  }catch(e){}
}

async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json();
  if(!r.ok){ if(r.status===403) pw=null; alert(d.error || 'خطأ'); return false; }
  return true;
}
async function del(r){
  if(!askPw()) return;
  if(!confirm('حذف نتيجة: ' + r.name + ' ؟ (يمكنه إعادة الفرض بعدها)')) return;
  if(await post('/api/admin/delete', {password:pw, id:r.id})) load();
}
$('#b-reset').onclick = async () => {
  if(!askPw()) return;
  if(!confirm('سيتم مسح كل النتائج نهائيًا. متأكدة؟')) return;
  if(await post('/api/admin/reset', {password:pw})) load();
};
$('#b-csv').onclick = () => { if(!askPw()) return; location.href = '/export.csv?pw=' + encodeURIComponent(pw); };

/* ---------- عرض الإجابات وطباعتها ---------- */
const LETA = ['أ','ب','ج','د'];
function renderReview(el, review){
  if(!review){ const p = document.createElement('p'); p.textContent = 'لا تتوفر تفاصيل الإجابات لهذه النتيجة (أُرسلت قبل تفعيل هذه الميزة).'; el.appendChild(p); return; }
  review.forEach((it, i) => {
    const box = document.createElement('div'); box.className = 'rv ' + (it.ok ? 'ok' : (it.chosen ? 'bad' : 'skip'));
    const hd = document.createElement('div'); hd.className = 'rv-h';
    const a = document.createElement('span'); a.textContent = 'السؤال ' + (i+1);
    const b = document.createElement('span'); b.className = 'st'; b.textContent = it.ok ? '✔ صحيحة (+1)' : (it.chosen ? '✘ خاطئة' : '— بدون إجابة');
    hd.append(a, b); box.appendChild(hd);
    const q = document.createElement('div'); q.className = 'rv-q'; q.setAttribute('dir','auto'); q.textContent = it.q; box.appendChild(q);
    if(it.image){ const im = document.createElement('img'); im.className = 'rv-img'; im.src = it.image; im.alt = ''; box.appendChild(im); }
    it.options.forEach((o, k) => {
      const row = document.createElement('div');
      const isC = o === it.correct, isW = o === it.chosen && !it.ok;
      row.className = 'rv-o' + (isC ? ' c' : '') + (isW ? ' w' : '');
      const mk = document.createElement('span'); mk.className = 'mk'; mk.textContent = isC ? '✔' : (isW ? '✘' : LETA[k]);
      const t = document.createElement('span'); t.setAttribute('dir','auto'); t.textContent = o;
      row.append(mk, t);
      if(isC || isW){ const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = isC ? (o === it.chosen ? 'إجابة التلميذ — صحيحة' : 'الإجابة الصحيحة') : 'إجابة التلميذ'; row.appendChild(tg); }
      box.appendChild(row);
    });
    el.appendChild(box);
  });
}
function studentBlock(item){
  const r = item.row, sec = document.createElement('section'); sec.className = 'stu';
  const h = document.createElement('h2'); h.textContent = r.name; sec.appendChild(h);
  const inf = document.createElement('div'); inf.className = 'info';
  [['القسم', r.group], ['الفوج', r.classGroup || '—'], ['العلامة', r.score + ' / ' + r.total], ['المدة', fmt(r.seconds)], ['الوقت', r.time]].forEach(([k, v]) => {
    const s = document.createElement('span'); s.append(k + ': '); const b = document.createElement('b'); if(k === 'العلامة' || k === 'المدة' || k === 'الوقت'){ const bd = document.createElement('bdi'); bd.dir = 'ltr'; bd.textContent = v; b.appendChild(bd); } else b.textContent = v; s.appendChild(b); inf.appendChild(s);
  });
  sec.appendChild(inf); renderReview(sec, item.review); return sec;
}
async function postJson(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ if(r.status===403) pw=null; alert(d.error || 'خطأ'); return null; }
  return d;
}
let curItem = null;
async function showAnswers(r){
  if(!askPw()) return;
  const d = await postJson('/api/admin/answers', {password:pw, id:r.id}); if(!d) return;
  curItem = {row:d.row, review:d.review};
  const body = $('#m-body'); body.innerHTML = ''; body.appendChild(studentBlock(curItem));
  $('#modal').classList.add('open');
}
$('#m-close').onclick = () => $('#modal').classList.remove('open');
$('#modal').onclick = e => { if(e.target.id === 'modal') $('#modal').classList.remove('open'); };
function doPrint(items){
  const pa = $('#print-area'); pa.innerHTML = ''; items.forEach(it => pa.appendChild(studentBlock(it)));
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); pa.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 150);
}
$('#m-print').onclick = () => { if(curItem) doPrint([curItem]); };
$('#b-printall').onclick = async () => {
  if(!askPw()) return;
  const d = await postJson('/api/admin/answers-all', {password:pw}); if(!d) return;
  if(!d.items.length){ alert('لا توجد نتائج للطباعة.'); return; }
  doPrint(d.items);
};

load(); setInterval(load, 3000);
</script>
</body>
</html>
